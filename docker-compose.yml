# 本地开发用 PostgreSQL：docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: oasis   # 仅本地开发
      POSTGRES_DB: oasis
    ports:
      - "5433:5432"   # 用 5433，避免和本机其他 PG 冲突
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
